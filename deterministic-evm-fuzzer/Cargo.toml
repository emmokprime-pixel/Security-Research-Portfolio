[package]
name = "deterministic-evm-fuzzer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "deterministic-evm-fuzzer"
path = "src/main.rs"

[[bin]]
name = "irm-fuzzer"
path = "src/irm_fuzzer.rs"

[dependencies]
revm = { version = "8.0.0", features = ["std", "serde"] }
alloy-primitives = { version = "0.7.2", features = ["serde"] }
ahash = "0.8.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
hex = "0.4.3"
bincode = "1.3"
eyre = "0.6"
# hex removed
